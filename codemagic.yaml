workflows:
  mlt:
    name: MLT I Training
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: taf-asc
    environment:
      xcode: latest
      vars:
        APP_DIR: "mlt-app"
        BUNDLE_ID: "com.theammoniafiles.mlt"
        XCODE_WORKSPACE: "mlt-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$APP_DIR"
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          cd "$APP_DIR"
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd "$APP_DIR/ios/App"
          pod install
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Use profiles
        script: |
          xcode-project use-profiles --workspace "$XCODE_WORKSPACE" --warn-only
      - name: Build ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

