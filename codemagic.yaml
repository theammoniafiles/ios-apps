workflows:
  mlt:
    name: MLT I Training
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: taf-asc
    environment:
      xcode: latest
      groups:
        - signing
      vars:
        APP_DIR: "mlt-app"
        BUNDLE_ID: "com.theammoniafiles.mlt"
        XCODE_WORKSPACE: "mlt-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$APP_DIR"
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          cd "$APP_DIR"
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd "$APP_DIR/ios/App"
          pod install
      - name: Install signing certificate and profiles
        script: |
          keychain initialize
          openssl enc -d -aes-256-cbc -pbkdf2 -in signing/dist.p12.enc -out /tmp/dist.p12 -k "$CERT_PASSWORD"
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CERT_PASSWORD"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profiles/*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Use profiles
        script: |
          xcode-project use-profiles --project "$APP_DIR/ios/App/App.xcodeproj" --warn-only
      - name: Build ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

