# Build both iOS apps on a cloud Mac and upload to TestFlight.
#
# No Mac needed: GitHub's macos-26 runner has Xcode 26. Apple requires
# uploads to be built with Xcode 26+ (iOS 26 SDK) since 28 April 2026.
# Runs on push to main (when either app changes) or manually.
#
# Required GitHub secrets (see README.md for how to create each):
#   APPLE_TEAM_ID
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD
#   IOS_TOOLS_PROFILE_B64, IOS_STORE_PROFILE_B64
#   APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_PRIVATE_KEY

name: Build iOS and upload to TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'tools-app/**'
      - 'store-app/**'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.app_name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: tools-app
            app_name: Refrigeration Tools
            bundle_id: com.theammoniafiles.tools
            profile_name: TAF Tools App Store
            ipa_name: refrigeration-tools
          - app_dir: store-app
            app_name: The Ammonia Files Store
            bundle_id: com.theammoniafiles.store
            profile_name: TAF Store App Store
            ipa_name: ammonia-files-store

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app_dir }}/package-lock.json

      - name: Install JS dependencies
        working-directory: ${{ matrix.app_dir }}
        run: npm ci

      - name: Sync Capacitor iOS project
        working-directory: ${{ matrix.app_dir }}
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ${{ matrix.app_dir }}/ios/App
        run: pod install

      - name: Install distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      - name: Install provisioning profile (Tools)
        if: matrix.app_dir == 'tools-app'
        env:
          PROFILE_B64: ${{ secrets.IOS_TOOLS_PROFILE_B64 }}
        run: |
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/profile.mobileprovision
          cp ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install provisioning profile (Store)
        if: matrix.app_dir == 'store-app'
        env:
          PROFILE_B64: ${{ secrets.IOS_STORE_PROFILE_B64 }}
        run: |
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/profile.mobileprovision
          cp ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (signed .xcarchive)
        working-directory: ${{ matrix.app_dir }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}' \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
          # NOTE: no PROVISIONING_PROFILE_SPECIFIER here — a command-line
          # specifier applies to EVERY target, including the Capacitor
          # framework in Pods, which rejects manual profiles
          # ("Capacitor does not support provisioning profiles").
          # With the profile installed in ~/Library and manual signing +
          # team set, xcodebuild matches the profile to the App target
          # by bundle ID. The export step maps bundle ID -> profile
          # explicitly in ExportOptions.plist.

      - name: Write App Store Connect API key file
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' '${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}' > "$RUNNER_TEMP/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

      - name: Export and upload to App Store Connect
        working-directory: ${{ matrix.app_dir }}
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ matrix.bundle_id }}</key>
              <string>${{ matrix.profile_name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ls -la build/export/ || true

      - name: Keep the .ipa as a workflow artifact (best effort)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ipa_name }}-1.0.${{ github.run_number }}
          path: ${{ matrix.app_dir }}/build/export/*.ipa
          if-no-files-found: warn
          retention-days: 30
