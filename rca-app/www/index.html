    {q:"What defines a mistake?", o:["The intention itself was wrong — the person believed the wrong plan was correct","Any error with serious consequences","The action was performed clumsily","An error by a new employee"], a:0, why:"Mistakes live in the plan, not the hands. They call for better information, procedures, and understanding."},
    {q:"A shortcut has been taken openly for years because the official route takes an hour. This is best treated as…", o:["Not a violation at all","A routine violation owned by the system that tolerated and rewarded it","A slip","Individual recklessness"], a:1, why:"When a departure becomes the normal way of working, the fix is the conditions and the standard — not one person's punishment."},
    {q:"Which fix matches slips and lapses best?", o:["Longer procedures","More classroom training","Design: labels, checklists, forcing functions, making the right action easy","Discipline"], a:2, why:"You cannot train away slips. You design the task so slips are hard to make and easy to catch."}]},
{ id:"c4l2", title:"Latent Causes — the Organization Behind the Failure", mins:5,
  sections:[
    {h:"Active failures and latent conditions", p:"The person at the machine commits the active failure — the valve turned, the check missed. But latent conditions are the pre-existing weaknesses built into the workplace long before: the PM deferred three times, the procedure two revisions behind the equipment, the alarm list nobody pruned, the vacancy that left one operator covering two areas. Latent conditions sit quietly until they line up with an active failure and a gap in the defenses."},
    {h:"Why latent causes are the real prize", p:"Fix the active failure and you have helped one situation. Fix a latent condition and you have removed a contributor from every future failure it would have fed. The deferred-PM backlog does not care which machine fails next. This is why deep investigations keep asking past the sharp end: the further back the cause, the wider its shadow — and the wider the benefit of removing it."},
    {h:"How to surface them", p:"Ask organizational questions explicitly: What did the workload look like? What state was the backlog in? When was this procedure last matched to the equipment? What did the last three similar work orders say, and what was done with them? Latent causes rarely appear in the physical evidence — they appear in the records, the rosters, and the gap between how work is imagined and how it is actually done."}],
  watch:["An investigation that never leaves the machine room — no questions about backlog, staffing, or procedure currency.","The same latent condition (deferred PM, dead alarm) appearing in investigation after investigation, unfixed.","Work-as-imagined procedures that describe a plant nobody actually works in."],
  quiz:[
    {q:"What is a latent condition?", o:["A hidden defect inside a component","An error the operator hides","A failure nobody has noticed yet","A pre-existing weakness built into the workplace — deferred PMs, outdated procedures, chronic understaffing — that sets up future failures"], a:3, why:"Latent conditions are organizational and present long before the event. They wait quietly until they combine with an active failure."},
    {q:"Why are latent causes called 'the real prize' of an investigation?", o:["They impress auditors","Removing one latent condition removes a contributor from many future failures, not just this one","They excuse the operator","They are easier to write about"], a:1, why:"Their shadow is wide: a backlog or a bad procedure feeds failure after failure until it is fixed."},
    {q:"Which question surfaces latent causes?", o:["'Who was on shift?'","'Is the part in stock?'","'When was this procedure last checked against the actual equipment?'","'How long will the repair take?'"], a:2, why:"Latent causes live in records, rosters, and procedure currency — organizational questions bring them out."},
    {q:"The active failure is best described as…", o:["The organizational weakness","The final report's conclusion","The oldest cause in the chain","The act or omission at the sharp end, at the moment of the event"], a:3, why:"Active failures happen at the point of work. Latent conditions are what made them likely and consequential."},
    {q:"The same dead alarm appears in three investigations in a year. That pattern means…", o:["A latent condition is being documented repeatedly but never removed — the system is filing its warnings instead of acting on them","Coincidence","Alarms are unreliable technology","Three careless crews"], a:0, why:"Recurring findings are the loudest latent-cause signal there is. The fix is organizational, not another note in a report."}]},
{ id:"c4l3", title:"Why Blame Kills the Next Investigation", mins:4,
  sections:[
    {h:"Blame feels like accountability; it works like a gag", p:"When the last investigation ended with someone written up, the next witnesses arrive with lawyers' instincts: short answers, no volunteering, documents 'somewhere.' The facts an investigator needs most — what really happened, including the awkward parts — are exactly the facts blame teaches people to bury. You can have punishment or you can have the truth. Investigations run on truth."},
    {h:"Accountability is not the same as blame", p:"Accountability means people answer honestly for their actions and the organization acts on what it learns — including real consequences for genuine recklessness. Blame is different: it is the emotional shortcut that stops at a person and learns nothing. A fair system separates the learning review from any disciplinary process, and treats honest reporting as something to protect, not punish."},
    {h:"The information you lose is invisible", p:"Nobody announces 'I am withholding what I know.' The interview just gets thinner, the near misses stop being reported, and the next failure arrives with no warning data at all. Plants with strong reporting cultures are not plants with fewer problems — they are plants that hear about problems while the problems are still cheap."}],
  watch:["Near-miss reports dropping after a high-profile investigation ended in discipline.","Witnesses asking 'am I in trouble?' before answering anything.","Interviews full of 'per procedure' answers that describe the manual instead of the day."],
  quiz:[
    {q:"What is blame's main cost to future investigations?", o:["It hurts morale in the abstract","It takes longer to write reports","Managers dislike paperwork","Witnesses stop volunteering the awkward facts investigations depend on"], a:3, why:"Fear edits testimony and kills near-miss reporting. The next investigation starts with worse evidence — or none."},
    {q:"How does accountability differ from blame?", o:["They are the same thing","Accountability answers honestly for actions and acts on what is learned; blame stops at a person and learns nothing","Blame is the formal process","Accountability never has consequences"], a:1, why:"Real recklessness still carries consequences in an accountable system — but learning is not sacrificed to punishment."},
    {q:"Near-miss reports fall sharply after an investigation ends in discipline. The best reading is…", o:["People learned that reporting is dangerous — the plant is now flying blinder","A coincidence of scheduling","The forms were too long","The plant got safer"], a:0, why:"Reporting is voluntary information. Punish its neighborhood and it quietly stops."},
    {q:"Why separate the learning review from the disciplinary process?", o:["To double the meetings","To protect guilty people","So witnesses can speak fully for learning, while any conduct questions are handled fairly on their own track","Legal requires two binders"], a:2, why:"Mixing the two guarantees the learning conversation gets the edited version of events."},
    {q:"A plant hears about many small problems early. This usually signals…", o:["A reporting culture where raising problems is safe — so problems get fixed while they are cheap","A plant with more problems than average","Too much free time","Weak supervision"], a:0, why:"High reporting is a sign of trust, and early knowledge is the cheapest failure prevention there is."}]},
{ id:"c4l4", title:"Traps: First Fix, Correlation, and 'Always Done It This Way'", mins:4,
  sections:[
    {h:"Trap one: the first fix that works", p:"The machine restarts after you change the part, so the part must have been the cause. Maybe — or the act of opening the machine reseated a connector, drained a trap, or reset a control, and the changed part was innocent. A restart proves the symptom stopped; it does not prove your theory. When the failure matters, ask what else changed during the repair before crediting the part."},
    {h:"Trap two: correlation wearing a cause's clothes", p:"Two things happening together is not one causing the other. Failures rose after the new shift pattern started — but the same month brought a production rate increase and a new parts supplier. Before crediting any one companion, check whether the failure follows it consistently, whether a mechanism connects them, and whether the failure ever happens without it."},
    {h:"Trap three: 'always done it this way'", p:"Longevity feels like proof. But conditions drift: rates go up, materials change, equipment ages, and the practice that was safe for a decade quietly crosses a line. Worse, success hides the margin — you never learn how close you were. Treat 'always' as a claim to test against today's conditions, not as a verdict."}],
  watch:["A failed part replaced and the old one scrapped unexamined — the verdict destroyed with the evidence.","A cause credited purely because it changed at the same time as the failures.","'Twenty years, no problem' offered as the entire defense of a practice nobody has re-examined."],
  quiz:[
    {q:"The machine restarts after a part swap. What has actually been proven?", o:["The symptom stopped — the repair may have fixed it another way, such as reseating or resetting something","The swapped part was the cause","The investigation is complete","The part vendor is at fault"], a:0, why:"Restart is evidence about the symptom, not the theory. Credit the cause only after asking what else changed during the repair."},
    {q:"Failures rose the same month as a new shift pattern — and a rate increase and a new supplier. Crediting the shift pattern alone is…", o:["Impossible to evaluate","Correct, because shifts affect everything","The correlation trap — companions must be separated by consistency checks and a plausible mechanism","Efficient"], a:2, why:"Simultaneous changes are confounded. A cause must track the failure consistently and connect by mechanism."},
    {q:"Which test helps separate correlation from cause?", o:["Checking the calendar","Checking whether the failure ever occurs without the suspected companion, and whether a mechanism links them","Voting in the toolbox talk","Asking who noticed first"], a:1, why:"If failures happen without it, it is not necessary; if it happens without failures, it is not sufficient. Mechanism plus consistency builds the case."},
    {q:"Why is 'we have always done it this way' weak evidence of safety?", o:["Old practices are always wrong","New is always better","It is not documented","Conditions drift — rate, materials, equipment age — and success hides how thin the margin has become"], a:3, why:"A practice can outlive the conditions that made it safe, and years of luck conceal the shrinking margin."},
    {q:"What should happen to the replaced part in an important failure?", o:["Scrap it immediately to keep the area tidy","Keep and examine it — it may prove or destroy the leading theory","Give it to the operator as a reminder","Return it for credit at once"], a:1, why:"The failed part is primary evidence. Discarding it unexamined destroys the verdict with it."}]},
{ id:"c4l5", title:"Corrective Actions That Actually Prevent Recurrence", mins:5,
  sections:[
    {h:"Strong actions change conditions; weak actions beg people", p:"Corrective actions sit on a strength ladder. Strongest: eliminate the hazard or redesign so the error cannot happen — a forcing function, an interlock, a different part that cannot be installed backwards. Middle: engineering and administrative barriers — alarms that get answered, revised procedures with verification steps, PM changes. Weakest: reminders, retraining, and 'be more careful.' Weak actions are not useless, but an action list made only of them is a plan to fail again politely."},
    {h:"Every action needs an owner and a date", p:"An action without a named owner and a due date is a wish. Write actions so a stranger could verify completion: not 'review lubrication practices' but 'add the gearbox oil sample to the monthly route, owner: planner, due: end of month, verified by route audit.' If completion cannot be checked, the action cannot be closed — and should not be written that way."},
    {h:"Aim at the cause, and check for side effects", p:"Trace each action back to a specific cause in your analysis; an action that maps to no cause is decoration. Then ask what the action changes elsewhere: the new interlock that stops the pump also stops it during a legitimate flush; the added inspection adds hours to an already overloaded route. Good actions prevent the failure without quietly planting the next one."}],
  watch:["An action list where every item is retrain, remind, or counsel.","Actions with no owner, no date, or verbs like 'review' and 'consider' that cannot be verified.","A fix so burdensome that the crew invents a workaround within a month — the workaround becomes the new latent condition."],
  quiz:[
    {q:"Which corrective action is strongest?", o:["Redesign the connection so the wrong part physically cannot be installed","Post a warning sign","Remind the crew at the safety talk","Retrain the operator"], a:0, why:"Eliminating the possibility of the error beats every appeal to attention. Design outranks vigilance."},
    {q:"Why is 'review lubrication practices' a defective action?", o:["It is too short","Reviews are forbidden","It mentions lubrication","It cannot be verified — no owner, no date, no observable end state"], a:3, why:"Actions must be checkable: a named owner, a due date, and a completion state a stranger could confirm."},
    {q:"An action that maps to no identified cause is…", o:["A bonus improvement","Decoration — effort spent where it cannot prevent the failure","Required for balance","Efficient"], a:1, why:"Every action should trace to a cause it removes or a barrier it restores. Unmapped actions consume the budget and leave the cause alive."},
    {q:"Before finalizing an action, what side-effect question matters?", o:["'What does this change elsewhere — could it plant the next failure or get worked around?'","'Is it the cheapest option?'","'Can it be done this shift?'","'Will the vendor like it?'"], a:0, why:"Interlocks, added checks, and new steps all ripple. Unworkable actions breed workarounds, which become latent conditions."},
    {q:"Where do 'retrain and remind' actions belong?", o:["Nowhere — they are banned","At the top of every action list","As supplements to stronger actions — acceptable support, never the whole plan","Only for new employees"], a:2, why:"Weak actions can reinforce a real fix. Alone, they leave every condition that produced the failure untouched."}]},
{ id:"c4l6", title:"Verifying the Fix Worked", mins:4,
  sections:[
    {h:"Installed is not the same as effective", p:"Closing an action because the work was done answers the wrong question. The right question is whether the failure stopped — and that takes time and a deliberate check. Define, when the action is written, how effectiveness will be judged: the failure-free interval to beat, the trend to watch, the audit to pass. A seal fix is verified by months of dry operation, not by the work order closing."},
    {h:"Watch for the failure moving, not dying", p:"Fixes sometimes relocate problems: the interlock stops the trip but production finds a bypass; the stiffer coupling survives but the gearbox bearing now takes the load. Verification includes looking downstream and sideways — did the failure truly end, or did it change its address? Check the neighboring equipment and the workaround culture, not just the original symptom."},
    {h:"Close the loop in the records", p:"Record the verification result where the next investigator will find it: the equipment history, the FMEA ratings, the PM plan. If the fix failed verification, reopen the analysis honestly — a failed fix is new evidence about the cause, not an embarrassment to bury. The plants that learn fastest are the ones whose records admit what did not work."}],
  watch:["Actions closed the day the part was installed, with no effectiveness check scheduled.","The same failure reappearing on the sister machine while the 'fixed' one is celebrated.","Verification defined as 'no complaints received.'"],
  quiz:[
    {q:"What distinguishes completion from effectiveness?", o:["Completion means the action was performed; effectiveness means the failure actually stopped, judged over a defined interval or check","Effectiveness is a management opinion","Completion requires a photo","Nothing — done is done"], a:0, why:"A work order closing proves activity. Only time, trends, or audits prove the failure is gone."},
    {q:"When should the effectiveness check be defined?", o:["Only for safety actions","When the action is written — the interval, trend, or audit that will judge it","At the annual review","After the action is closed"], a:1, why:"Defining success in advance prevents the quiet slide into 'no news is good news.'"},
    {q:"The trip stopped after an interlock was added, but crews now bypass it weekly. The fix is…", o:["Effective — no trips","A training issue only","Complete, since the interlock works","Not effective — the failure changed its address into a workaround, which is a new latent condition"], a:3, why:"Verification must look for relocation and workarounds, not just the absence of the original symptom."},
    {q:"A fix fails verification. The correct response is…", o:["Reopen the analysis: the failed fix is new evidence that the cause was wrong or incomplete","Wait another year","Blame the installer","Close it anyway — effort was made"], a:0, why:"A failed fix is data. Honest reopening is how investigations converge on the real cause."},
    {q:"Where should verification results be recorded?", o:["In the investigator's notebook only","On the break-room board","In the equipment history and related plans, where the next investigator will find them","Nowhere — verbal is fine"], a:2, why:"Records are the plant's memory. Verification that is not recorded cannot teach the next investigation."}]},
{ id:"c4l7", title:"Writing the RCA Report and Tracking Actions to Closure", mins:5,
  sections:[
    {h:"A report a stranger could act on", p:"Write for the reader who was not there: the problem stated precisely, the timeline with sources, the evidence, the causes tested and how the dead ones died, the causes found, and the actions with owners and dates. Keep facts, inferences, and opinions visibly separate, exactly as you did in the investigation. A report that hides its reasoning cannot be reviewed — and unreviewable findings should not be trusted, including by you."},
    {h:"Short enough to be read, complete enough to be checked", p:"Length is not rigor. Most plant failures deserve a tight few pages: one page of problem and timeline, one of analysis, one of actions. Put the bulky evidence — photos, trends, interview notes — in an appendix or the equipment file and reference it. The test: a competent reader can follow your logic in fifteen minutes and find every receipt you relied on."},
    {h:"Tracking is where reports go to live or die", p:"Actions enter a tracked list with owners and dates, get reviewed on a rhythm — weekly for the overdue, monthly for the open — and close only on verification, not on someone's say-so. Overdue actions escalate visibly rather than aging quietly. And when the last action closes, the report goes into the equipment's history, so the next failure of that machine starts from knowledge instead of from zero."}],
  watch:["A report whose conclusion cannot be traced to any evidence section — the reasoning is missing.","Actions that live only inside the report document, in no tracked system, aging invisibly.","Closure rates that look perfect because actions are written vaguely enough to always be 'done.'"],
  quiz:[
    {q:"Who should the report be written for?", o:["A competent reader who was not there — they must be able to follow the logic and find the evidence","The investigator's manager only","The file, unread","The person found at fault"], a:0, why:"Findings that cannot be followed and checked cannot be trusted or acted on with confidence."},
    {q:"How should facts and opinions be handled in the report?", o:["Blended for readability","Facts only in the appendix","Opinions omitted entirely, even as labeled hypotheses","Kept visibly separate, as in the investigation itself"], a:3, why:"Separation lets reviewers weigh each claim correctly and see exactly what the conclusions rest on."},
    {q:"What is the right home for bulky evidence like photos and trends?", o:["Deleted once the report is written","In the investigator's personal drive","In an appendix or the equipment file, referenced from the report","Printed and posted"], a:2, why:"The report stays readable while every receipt remains findable by the next reader."},
    {q:"When may a corrective action be closed?", o:["At the end of the quarter","When completion is verified — and effectiveness checks are scheduled or passed per the plan","When the owner says it is done","When the report is filed"], a:1, why:"Say-so closure is how action lists become fiction. Verification is the closure standard."},
    {q:"What should happen to the finished report?", o:["It is emailed once and deleted","It is kept by the investigator","It stays in the meeting folder","It goes into the equipment's history so the next failure starts from knowledge"], a:3, why:"Filed with the equipment, the report becomes the plant's memory — the starting point, not a repeat, of the next investigation."}]}
]}
];

var TIPS = [
"State the problem in one sentence with the equipment, the failure, and the pattern — before anyone offers a cause.",
"Photograph the scene before anything is touched; memory edits itself within the hour.",
"Ask what changed. Failures love to start at a change — a part, a person, a setpoint, a supplier.",
"The failed part is evidence. Bag it, tag it, and keep it until the investigation closes.",
"A symptom treated three times is a cause nobody has looked for yet.",
"Interview witnesses separately, soon, and with open questions — never with your theory in the question.",
"Every timeline entry gets a time and a source. No source, no entry.",
"Mark the gaps in your timeline honestly; an honest gap points at the monitoring you need.",
"Run the replacement test: would a competent person in the same spot likely have done the same?",
"When two different people make the same error, stop retraining people and start fixing the trap.",
"If fixing your candidate cause still lets the failure recur, you found a link, not the root.",
"Five whys is a guideline, not a quota — stop at an actionable cause, whether that takes three whys or seven.",
"A fishbone diagram generates candidates. Only testing against evidence promotes one to a finding.",
"In a fault tree, hunt for AND gates — one restored barrier there blocks the whole path.",
"Never let a low RPN bury a high severity. Rare and catastrophic still gets action.",
"Slips need design fixes, mistakes need better information, routine violations need the system fixed.",
"Discipline after an honest report buys you silence at the next investigation.",
"A restart proves the symptom stopped. It does not prove your theory about the cause.",
"Correlation needs a mechanism and consistency before it earns the name cause.",
"'We have always done it this way' is a claim to test against today's conditions, not a verdict.",
"Write actions a stranger could verify: an owner, a date, and an observable end state.",
"Installed is not effective. Define the check that will prove the failure actually stopped.",
"A fix that gets worked around within a month has just planted the next latent condition.",
"File the finished report in the equipment history — the next failure should start from knowledge, not from zero."
];

/* ===================== STATE ===================== */
var KEY = "taf-rca-training-v1";
var state = { done:{}, best:{} };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var p = JSON.parse(raw); if (p && p.done && p.best) state = p; }
} catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

var ALL = [];
COURSES.forEach(function(c){ c.lessons.forEach(function(l){ ALL.push({course:c, lesson:l}); }); });
function totalDone(){ return ALL.filter(function(x){ return state.done[x.lesson.id]; }).length; }
function courseDone(c){ return c.lessons.filter(function(l){ return state.done[l.id]; }).length; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ===================== NAV ===================== */
var views = ["home","courses","lesson","quizbank","tips"];
var currentTab = "home";
function show(name){
  views.forEach(function(v){ document.getElementById("view-"+v).classList.toggle("hidden", v!==name); });
  var tabFor = (name==="lesson") ? "courses" : name;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.tab===tabFor); });
  currentTab = name;
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    var tab = t.dataset.tab;
    if (tab==="home") renderHome();
    if (tab==="courses") renderCourses();
    if (tab==="quizbank") renderQuizBank();
    if (tab==="tips") renderTips();
    show(tab);
  });
});

/* ===================== HOME ===================== */
var resetArmed = false, resetTimer = null;
function badges(){
  var d = totalDone();
  var c1 = COURSES[0].lessons.every(function(l){ return state.done[l.id]; });
  var c3 = COURSES[2].lessons.every(function(l){ return state.done[l.id]; });
  return [
    {icon:"⚙", name:"First Lesson Done", desc:"Pass any 1 lesson", got: d>=1},
    {icon:"🔧", name:"Halfway There", desc:"Pass 14 of 28 lessons", got: d>=14},
    {icon:"🧭", name:"Foundations Complete", desc:"Finish Course 1", got: c1},
    {icon:"🌳", name:"Methods Complete", desc:"Finish Course 3", got: c3},
    {icon:"🏆", name:"All Lessons Complete", desc:"Pass all 28 lessons", got: d>=ALL.length}
  ];
}
function nextLesson(){
  for (var i=0;i<ALL.length;i++){ if (!state.done[ALL[i].lesson.id]) return ALL[i]; }
  return null;
}
function renderHome(){
  var d = totalDone(), total = ALL.length;
  var pct = Math.round(d/total*100);
  var C = 2*Math.PI*48, off = C - (C*d/total);
  var nx = nextLesson();
  var html = "";
  html += '<div class="hero"><div class="ring-wrap">'
    + '<svg width="118" height="118" viewBox="0 0 118 118">'
    + '<circle cx="59" cy="59" r="48" fill="none" stroke="#1d3552" stroke-width="11"/>'
    + '<circle cx="59" cy="59" r="48" fill="none" stroke="#4da3ff" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
    + '</svg><div class="ring-center"><div class="pct">'+pct+'%</div><div class="lbl">'+d+' of '+total+' lessons</div></div></div>'
    + '<div class="hero-txt"><h2>'+(d===0 ? "Learn to fix it for good" : (nx ? "Keep going — you're on track" : "All lessons passed. Nice work."))+'</h2>'
    + '<p>28 short lessons and 140 quiz questions on finding the real cause of failures — evidence, timelines, 5 Whys, fishbone, fault trees, FMEA, and fixes that hold.</p>'
    + (nx ? '<button class="btn" id="startBtn">'+(d===0?"Start: ":"Continue: ")+esc(nx.lesson.title)+'</button>'
          : '<button class="btn" id="startBtn">Review courses</button>')
    + '</div></div>';
  html += '<p class="disclaimer">Training and preparation only — this app does not grant any certification. Progress is stored only on this device.</p>';
  html += '<h2 class="sec">Your courses</h2>';
  COURSES.forEach(function(c){
    var cd = courseDone(c), ct = c.lessons.length, pc = Math.round(cd/ct*100);
    html += '<div class="course-card"><div class="row"><h3>'+esc(c.title)+'</h3><span class="cnt">'+cd+' / '+ct+' passed</span></div>'
      + '<div class="bar"><i style="width:'+pc+'%"></i></div></div>';
  });
  html += '<h2 class="sec">Badges</h2><div class="badges">';
  badges().forEach(function(b){
    html += '<div class="badge '+(b.got?"earned":"locked")+'"><div class="ic">'+b.icon+'</div><div><b>'+esc(b.name)+'</b><span>'+(b.got?"Earned ✓":esc(b.desc))+'</span></div></div>';
  });
  html += '</div>';
  html += '<div class="reset-zone"><button class="reset-link" id="resetLink">Reset all progress</button></div>';
  document.getElementById("view-home").innerHTML = html;
  document.getElementById("startBtn").addEventListener("click", function(){
    if (nx) openLesson(nx.course, nx.lesson); else { renderCourses(); show("courses"); }
  });
  var rl = document.getElementById("resetLink");
  rl.addEventListener("click", function(){
    if (!resetArmed) {
      resetArmed = true; rl.textContent = "Tap again to confirm reset — this clears all progress"; rl.classList.add("armed");
      clearTimeout(resetTimer); resetTimer = setTimeout(function(){ resetArmed=false; renderHome(); if(currentTab==="home") show("home"); }, 4000);
    } else {
      clearTimeout(resetTimer); resetArmed = false;
      state = { done:{}, best:{} }; save(); renderHome(); show("home");
    }
  });
}

/* ===================== COURSES ===================== */
function renderCourses(){
  var html = "";
  COURSES.forEach(function(c, ci){
    html += '<h2 class="sec">Course '+(ci+1)+' · '+esc(c.title)+'</h2>';
    c.lessons.forEach(function(l, li){
      var done = !!state.done[l.id];
      var best = state.best[l.id];
      html += '<button class="lesson-row'+(done?" done":"")+'" data-c="'+c.id+'" data-l="'+l.id+'">'
        + '<span class="num">'+(done?"✓":(li+1))+'</span>'
        + '<span class="t"><b>'+esc(l.title)+'</b><span>'+l.mins+' min read · 5 questions'+(best!=null ? ' · Best score '+best+'/5' : '')+(done?' · Passed':'')+'</span></span>'
        + '<span class="chev">›</span></button>';
    });
  });
  document.getElementById("view-courses").innerHTML = html;
  document.querySelectorAll("#view-courses .lesson-row").forEach(function(b){
    b.addEventListener("click", function(){
      var c = COURSES.filter(function(x){ return x.id===b.dataset.c; })[0];
      var l = c.lessons.filter(function(x){ return x.id===b.dataset.l; })[0];
      openLesson(c, l);
    });
  });
}

/* ===================== LESSON ===================== */
var quizState = null;
function openLesson(course, lesson){
  quizState = { answers:{}, score:0, total:lesson.quiz.length, lessonId:lesson.id };
  var ci = COURSES.indexOf(course)+1;
  var li = course.lessons.indexOf(lesson)+1;
  var html = '<button class="backlink" id="backBtn">‹ Back to courses</button>';
  html += '<div class="lesson-head"><h2>'+esc(lesson.title)+'</h2>'
    + '<p class="meta">Course '+ci+' · '+esc(course.title)+' · Lesson '+li+' of '+course.lessons.length+' · '+lesson.mins+' min read</p></div>';
  lesson.sections.forEach(function(s){
    html += '<div class="teach"><h3>'+esc(s.h)+'</h3><p>'+esc(s.p)+'</p></div>';
  });
  html += '<div class="watch"><h3>⚠ What to watch for</h3><ul>';
  lesson.watch.forEach(function(w){ html += '<li>'+esc(w)+'</li>'; });
  html += '</ul></div>';
  html += '<h3 class="quiz-title">Check your understanding</h3><p class="quiz-sub">5 questions · score 4 or 5 to pass · unlimited retakes</p>';
  html += '<div id="quizZone">';
  lesson.quiz.forEach(function(q, qi){
    html += '<div class="q" data-q="'+qi+'"><p class="qq">'+(qi+1)+'. '+esc(q.q)+'</p>';
    q.o.forEach(function(o, oi){
      html += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>';
    });
    html += '<p class="why" id="why-'+qi+'"></p></div>';
  });
  html += '</div><div id="lessonResult"></div>';
  document.getElementById("view-lesson").innerHTML = html;
  document.getElementById("backBtn").addEventListener("click", function(){ renderCourses(); show("courses"); });
  document.querySelectorAll("#view-lesson .opt").forEach(function(b){
    b.addEventListener("click", function(){ answerLesson(lesson, b); });
  });
  show("lesson");
}
function answerLesson(lesson, btn){
  var qi = +btn.dataset.q, oi = +btn.dataset.o;
  if (quizState.answers[qi] != null) return;
  var q = lesson.quiz[qi];
  quizState.answers[qi] = oi;
  var correct = (oi === q.a);
  if (correct) quizState.score++;
  var box = btn.closest(".q");
  box.querySelectorAll(".opt").forEach(function(o){
    o.disabled = true;
    var oidx = +o.dataset.o;
    if (oidx === q.a) o.classList.add("correct");
    else if (oidx === oi) o.classList.add("wrong");
    else o.classList.add("dim");
  });
  var why = document.getElementById("why-"+qi);
  why.innerHTML = (correct ? "<b>Correct.</b> " : "<b>Not quite.</b> ") + esc(q.why);
  why.classList.add("show");
  if (Object.keys(quizState.answers).length === quizState.total) finishLesson(lesson);
}
function finishLesson(lesson){
  var s = quizState.score, pass = s >= 4;
  var prevBest = state.best[lesson.id] || 0;
  if (s > prevBest) state.best[lesson.id] = s;
  if (pass) state.done[lesson.id] = true;
  save();
  var html = '<div class="result '+(pass?"pass":"fail")+'"><h3>'+(pass?"Passed":"Not yet")+' — '+s+' / 5</h3>'
    + '<p>'+(pass ? "Lesson marked complete. Your best score is saved on this device."
                   : "You need 4 of 5 to pass. Re-read the sections above and try again — retakes are unlimited.")+'</p>'
    + '<div class="rowbtns"><button class="btn ghost" id="retakeBtn">Retake quiz</button>'
    + '<button class="btn" id="toCoursesBtn">Back to courses</button></div></div>';
  var zone = document.getElementById("lessonResult");
  zone.innerHTML = html;
  zone.scrollIntoView({behavior:"smooth", block:"center"});
  document.getElementById("retakeBtn").addEventListener("click", function(){
    var c = COURSES.filter(function(x){ return x.lessons.indexOf(lesson) >= 0; })[0];
    openLesson(c, lesson);
  });
  document.getElementById("toCoursesBtn").addEventListener("click", function(){ renderCourses(); show("courses"); });
}

/* ===================== QUIZ BANK ===================== */
var bank = null;
function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function renderQuizBank(){
  var pool = [];
  ALL.forEach(function(x){ x.lesson.quiz.forEach(function(q){ pool.push({q:q, lessonTitle:x.lesson.title, courseTitle:x.course.title}); }); });
  shuffle(pool);
  bank = { items: pool.slice(0,20), answers:{}, score:0 };
  var html = '<div class="lesson-head"><h2>Quiz Bank</h2><p class="meta">20 questions drawn at random from all 140 lesson questions. Quiz Bank scores do not mark lessons as passed.</p></div>';
  html += '<button class="btn block" id="newBankBtn" style="margin-bottom:14px">↻ New 20 questions</button>';
  html += '<div id="bankZone">';
  bank.items.forEach(function(it, qi){
    html += '<div class="q" data-q="'+qi+'"><p class="qq">'+(qi+1)+'. '+esc(it.q.q)+'</p>';
    it.q.o.forEach(function(o, oi){ html += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>'; });
    html += '<p class="why" id="bwhy-'+qi+'"></p></div>';
  });
  html += '</div><div id="bankResult"></div>';
  document.getElementById("view-quizbank").innerHTML = html;
  document.getElementById("newBankBtn").addEventListener("click", function(){ renderQuizBank(); show("quizbank"); });
  document.querySelectorAll("#view-quizbank .opt").forEach(function(b){
    b.addEventListener("click", function(){ answerBank(b); });
  });
}
function answerBank(btn){
  var qi = +btn.dataset.q, oi = +btn.dataset.o;
  if (bank.answers[qi] != null) return;
  var it = bank.items[qi], q = it.q;
  bank.answers[qi] = oi;
  var correct = (oi === q.a);
  if (correct) bank.score++;
  var box = btn.closest(".q");
  box.querySelectorAll(".opt").forEach(function(o){
    o.disabled = true;
    var oidx = +o.dataset.o;
    if (oidx === q.a) o.classList.add("correct");
    else if (oidx === oi) o.classList.add("wrong");
    else o.classList.add("dim");
  });
  var why = document.getElementById("bwhy-"+qi);
  why.innerHTML = (correct ? "<b>Correct.</b> " : "<b>Not quite.</b> ") + esc(q.why);
  why.classList.add("show");
  if (Object.keys(bank.answers).length === bank.items.length) finishBank();
}
function finishBank(){
  var s = bank.score, total = bank.items.length;
  var msg;
  if (s >= 18) msg = "Sharp work. Keep the streak warm with a fresh set now and then.";
  else if (s >= 14) msg = "Solid. Review the misses below and you'll close the gap fast.";
  else if (s >= 10) msg = "Getting there. Work through the missed lessons, then draw a new set.";
  else msg = "Good starting point — the lessons are short. Revisit the topics below and try a fresh 20.";
  var html = '<div class="result '+(s>=14?"pass":"fail")+'"><h3>Score: '+s+' / '+total+'</h3><p>'+msg+'</p>'
    + '<div class="rowbtns"><button class="btn" id="againBtn">New 20 questions</button></div></div>';
  var missed = bank.items.filter(function(it, i){ return bank.answers[i] !== it.q.a; });
  if (missed.length){
    html += '<h2 class="sec">Missed questions — review</h2>';
    missed.forEach(function(it){
      html += '<div class="missed"><div class="src">From: '+esc(it.lessonTitle)+'</div>'
        + '<p><b>'+esc(it.q.q)+'</b></p>'
        + '<p class="ca">Correct answer: '+esc(it.q.o[it.q.a])+'</p>'
        + '<p>'+esc(it.q.why)+'</p></div>';
    });
  } else {
    html += '<div class="missed"><p><b>Perfect run — no misses to review.</b></p></div>';
  }
  var zone = document.getElementById("bankResult");
  zone.innerHTML = html;
  zone.scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("againBtn").addEventListener("click", function(){ renderQuizBank(); show("quizbank"); });
}

/* ===================== TIPS ===================== */
function renderTips(){
  var html = '<div class="lesson-head"><h2>RCA Tips</h2><p class="meta">24 weekly field tips — one practical habit at a time.</p></div>';
  TIPS.forEach(function(t, i){
    html += '<div class="tip"><span class="wk">Week '+(i+1)+'</span><p>'+esc(t)+'</p></div>';
  });
  document.getElementById("view-tips").innerHTML = html;
}

/* ===================== INIT ===================== */
renderHome();
renderCourses();
renderTips();
show("home");
</script>
