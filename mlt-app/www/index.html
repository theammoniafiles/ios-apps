    {h:"Circulating systems — the controlled end", p:"A pump delivers filtered, often cooled oil to each point and returns it to a reservoir. Circulating systems suit high speed, high heat, and critical machines: flow can be monitored, oil can be cleaned continuously, and temperature controlled. The cost is complexity — pumps, filters, coolers, alarms — and a pump failure is a lubrication failure, so monitoring matters."},
    {h:"Mist and the middle ground", p:"Oil mist systems carry tiny oil droplets in air through piping to many points — common on pump and motor bearing fleets. They deliver fresh oil continuously and keep housings slightly pressurized against contamination. Ring-oiled and wick systems sit between bath and circulation: a ring riding the shaft lifts oil from a small sump to the journal, simple but sensitive to level, speed, and oil viscosity."}],
  watch:["A bath gearbox run 10 mm low — the top gear may be running on splash that no longer reaches it.","Circulating system flow alarms acknowledged but never investigated.","Oil rings not spinning — check through the sight glass; a stalled ring means a starved journal."],
  quiz:[
    {q:"In a splash/bath system, the most critical routine check is…", o:["Pump amps","Oil color","Oil level — too low starves parts, too high churns and overheats","Filter differential pressure"], a:2, why:"Bath systems live and die by level; there's no pump to compensate."},
    {q:"Circulating systems are preferred for critical, high-heat machines because…", o:["Oil can be filtered, cooled, and flow-monitored continuously","They use less oil","They use no filters","They never fail"], a:0, why:"Pumped delivery with filtration and cooling gives control that bath systems can't."},
    {q:"Oil mist systems deliver lubricant as…", o:["A solid stream","Grease cartridges","A bath the parts dip into","Tiny oil droplets carried in air to many points"], a:3, why:"Mist generators atomize oil into an air stream piped to each bearing housing."},
    {q:"A ring-oiled bearing's ring must be seen to be…", o:["Submerged completely","Rotating with the shaft, lifting oil to the journal","Removed monthly","Stationary"], a:1, why:"The ring carries oil from sump to shaft by rotation; a stalled ring starves the bearing."},
    {q:"A weakness of simple bath systems is…", o:["They require mist generators","They use pumps","They cool the oil too much","No filtration while running — oil condition depends on changes and cleanliness"], a:3, why:"Without circulation through a filter, contaminants stay in the bath until the oil is changed."}]},
{ id:"c4l4", title:"Greasing Bearings — How Much Is Too Much", mins:5,
  sections:[
    {h:"More is not better — it's hotter", p:"An over-greased bearing churns grease like a mixer. Churning makes heat, heat thins the oil out of the grease, the grease oxidizes and hardens, seals get pushed out — and the bearing fails from too much lubricant. Under-greasing starves the contact. The target is a bearing cavity roughly one-third to one-half full of grease for most bearings, with the contact itself continuously fed a small amount."},
    {h:"Know your gun's dose", p:"One stroke of a typical hand grease gun delivers roughly 1 gram of grease — but it varies by gun, so calibrate yours: pump ten strokes onto a scale and divide. Without that number, 'three pumps per bearing' is a guess dressed as a procedure. Lever guns, pistol grips, and battery guns all deliver differently."},
    {h:"Technique that protects bearings", p:"Clean the fitting before the gun goes on — you're about to push whatever is on it into the bearing. Pump slowly, ideally while the shaft turns if it's safe, and stop if you feel sudden high resistance. If a relief plug exists, remove it during greasing so old grease and pressure can escape. Log the amount per point; the quantity is part of the task, not a detail."}],
  watch:["A bearing that runs hotter right after greasing and cools over days — classic over-greasing signature.","Grease purging past seals every round — the cavity is full and the excess has nowhere else to go.","Fittings caked in dirt being greased without a wipe — you're injecting the dirt."],
  quiz:[
    {q:"A typical hand grease gun delivers about how much per stroke?", o:["Exactly 1 gram for every gun ever made","Roughly 1 gram — approximate, and it varies by gun","About 10 grams","About 100 grams"], a:1, why:"Roughly a gram per stroke is typical, but calibrate your own gun — delivery varies."},
    {q:"The right grease fill for most bearing cavities is about…", o:["As much as the gun can force in","A single pea-sized dab","Completely packed solid","One-third to one-half of the free space"], a:3, why:"One-third to one-half full feeds the contact without churning; packed solid overheats."},
    {q:"Over-greasing a bearing causes…", o:["Churning, heat, seal damage, and eventual failure","Lower friction always","Cooler running","Better sealing forever"], a:0, why:"Excess grease churns into heat, degrades, and can blow seals out."},
    {q:"Before attaching the gun, you should…", o:["Remove the fitting","Add more dirt to the fitting","Clean the grease fitting so you don't inject contamination","Heat the fitting"], a:2, why:"The gun pushes surface dirt straight into the bearing unless the fitting is wiped first."},
    {q:"How do you calibrate a grease gun's output?", o:["All guns are identical","Ask another technician","Read the box it came in","Pump a counted number of strokes onto a scale and divide the weight"], a:3, why:"Weighing a known number of strokes gives your gun's real grams-per-stroke."}]},
{ id:"c4l5", title:"Automatic Lubricators", mins:4,
  sections:[
    {h:"Why automate", p:"Automatic lubricators — single-point units and multi-line systems — deliver small, frequent doses of grease or oil on schedule. That beats the manual pattern of too much, too late. They shine on points that are dangerous to reach, easy to forget, or sensitive to dose size, and they keep feeding during nights and weekends when nobody is on rounds."},
    {h:"Types you'll meet", p:"Single-point lubricators include spring, gas-driven, and electromechanical units screwed onto one bearing each, set to empty over weeks or months. Centralized systems use a pump and divider valves or progressive distributors to feed many points from one reservoir — powerful, but a blocked line can quietly starve one point while the rest look fine."},
    {h:"Automation is not abdication", p:"Units run empty, batteries die, lines plug, and settings get bumped. Automatic systems still need inspection routes: confirm the unit is dispensing, check the reservoir level, verify the bearing is actually receiving grease, and replace or refill on schedule. The failure mode of automation is silent — nobody notices until the bearing does."}],
  watch:["A single-point lubricator past its replacement date, empty but still mounted like it's working.","Centralized system pressure fine while one divider line is blocked solid.","Settings changed by hand with no record — nobody knows the dose anymore."],
  quiz:[
    {q:"The main advantage of automatic lubricators is…", o:["They use no grease","They never need inspection","Small, frequent, on-schedule doses instead of too much, too late","They eliminate bearings"], a:2, why:"Steady small doses match bearing needs better than infrequent manual floods."},
    {q:"Single-point lubricators are typically…", o:["Hand guns with bigger handles","Individual units mounted on one bearing, set to dispense over weeks or months","Oil mist generators","Whole-plant systems"], a:1, why:"One unit serves one point and empties over a set period."},
    {q:"The dangerous failure mode of centralized systems is…", o:["Grease that is too clean","Too much noise","A blocked line silently starving one point while others look normal","Excess battery life"], a:2, why:"Divider systems can fault at one outlet without obvious signs at the pump."},
    {q:"Automatic systems still require…", o:["Manual greasing on top of every dose","Daily full disassembly","Nothing after installation","Inspection routes — check dispensing, levels, and that bearings receive lubricant"], a:3, why:"Empty units, dead batteries, and plugged lines fail silently without routine checks."},
    {q:"Good candidates for automatic lubrication include points that are…", o:["Dangerous to reach, easy to forget, or dose-sensitive","Never used","Already failed","Right beside the storeroom"], a:0, why:"Automation pays most where manual service is risky, unreliable, or imprecise."}]},
{ id:"c4l6", title:"Lubrication Failure Modes", mins:5,
  sections:[
    {h:"Starvation and the wrong product", p:"The most common lubrication failures are embarrassingly basic: no lubricant (missed task, empty lubricator, blocked line), the wrong lubricant (viscosity too thin to hold a film, or an incompatible grease quietly destroying itself), or lubricant in the wrong amount. These aren't exotic metallurgy — they're program failures, and they're preventable."},
    {h:"Contaminated and degraded lubricant", p:"Next come dirty and worn-out lubricants. Abrasive contamination grinds surfaces; water corrodes and fatigues them; oxidized oil turns acidic and varnishes. Each shows evidence: particles and silicon on analysis, TAN climbing, grease hardened or bled in the housing. The failure mode names the fix — exclusion and filtration for dirt, source control for water, condition-based changes for oxidation."},
    {h:"Read the failed part", p:"Failed bearings tell the story if you look before scrapping them: scoring and dull frosting point to abrasion; rust and etched surfaces to water; darkened, heat-tinted metal to starvation or overload; spalling with dented raceways to debris fatigue. Match the evidence to the mode, fix the mode — swapping the bearing without fixing the cause just schedules the repeat failure."}],
  watch:["The same bearing position failing repeatedly — the cause is in the system, not the bearing bin.","A failed bearing thrown in scrap before anyone looked at it — evidence destroyed.","Failure reports that say 'bearing failed' with no mode — that's a description, not a diagnosis."],
  quiz:[
    {q:"The most common lubrication failure causes are…", o:["Missing, wrong, or wrong-amount lubricant — basic program failures","Bearings wearing out exactly on schedule","Exotic metallurgy defects","Lightning strikes"], a:0, why:"Starvation, wrong product, and wrong quantity dominate real-world lubrication failures."},
    {q:"Dented raceways with later spalling point to…", o:["Wrong NLGI grade only","Debris particles denting the surface and seeding fatigue","Over-greasing","Water corrosion"], a:1, why:"Hard particles pressed through the contact leave dents whose edges start fatigue spalls."},
    {q:"Rust and etched surfaces on a failed bearing suggest…", o:["High viscosity","Abrasive dirt","Water contamination","Too much filtration"], a:2, why:"Corrosion patterns are water's signature on bearing steel."},
    {q:"Why inspect a failed bearing before scrapping it?", o:["Its damage pattern identifies the failure mode so you fix the cause, not just the part","To weigh it","Scrap yards require it","To reuse it"], a:0, why:"Scoring, rust, heat tint, and spalling each point to a different root cause."},
    {q:"Oxidized, degraded oil contributes to failure by…", o:["Making oil too slippery","Cleaning the machine","Increasing film thickness","Forming acids and varnish and losing protective additives"], a:3, why:"Oxidation depletes additives and creates corrosive, deposit-forming byproducts."}]},
{ id:"c4l7", title:"Running a Lubrication Program", mins:5,
  sections:[
    {h:"A program is a system, not a person", p:"A lubrication program that depends on one conscientious technician collapses when that person is away. A real program is written down: an asset list with every lubricated point, the correct product, the correct amount, the correct interval, and the correct procedure — assigned, scheduled, and tracked like any other maintenance work."},
    {h:"The building blocks", p:"Consolidated, labeled products; clean storage and transfer; routes built around equipment, not memory; condition monitoring through oil analysis and inspections; and training so every person who touches a grease gun knows why the details matter. Identification is the glue — machine tags, container labels, and color or shape coding that all agree with each other."},
    {h:"Measure and improve", p:"Track what tells the truth: route completion, oil analysis alarm rates, cleanliness results versus target, lubricant consumption, and repeat failures. Review them, fix the biggest leak in the system, and repeat. Programs don't fail in a day and don't heal in a day — steady, measured pressure on the basics is what moves reliability."}],
  watch:["Routes that exist on paper but completion is never checked.","One person holding the whole program in their head — a single point of failure.","Money spent on premium lubricants while storage and transfer stay dirty — the basics outrank the boutique."],
  quiz:[
    {q:"A sound lubrication program is built on…", o:["One expert's memory","Buying premium oil only","Greasing everything weekly","A written asset list with product, amount, interval, and procedure for every point"], a:3, why:"Documented, scheduled, tracked tasks survive vacations and turnover; memory doesn't."},
    {q:"Identification systems (tags, labels, coding) matter because…", o:["They look tidy","They replace training","They prevent wrong-product application, the most basic failure","Auditors like colors"], a:2, why:"Matching machine and container identification is what stops the wrong lubricant reaching the point."},
    {q:"Useful program metrics include…", o:["The number of drums purchased","Route completion, analysis alarm rates, cleanliness vs target, and repeat failures","Technicians' opinions only","How shiny the storeroom floor is"], a:1, why:"These measures show whether the system is actually controlling lubrication."},
    {q:"Oil analysis in a program serves to…", o:["Verify contamination control and lubricant condition so actions are condition-based","Fill filing cabinets","Replace all inspections","Justify never changing oil"], a:0, why:"Analysis closes the loop — it proves exclusion and filtration work and times interventions by condition."},
    {q:"The right order of investment for a weak program is usually…", o:["More grease guns","Basics first — storage, transfer, identification, routes — then upgrades","Premium synthetics first, basics later","A bigger storeroom"], a:1, why:"Clean handling and correct application of standard products beat premium products handled badly."}]}
]}
];

/* ===================== TIPS ===================== */
var TIPS = [
"Wipe every grease fitting clean before the gun goes on — the dirt on it is headed straight into the bearing.",
"Calibrate your grease gun once: ten strokes on a scale tells you your real grams per stroke.",
"Store drums indoors and off the floor; a drum that breathes rainwater is a water pump.",
"Label every transfer container with the exact product name — 'the yellow jug' is not a specification.",
"Check oil level with the machine in its normal state, and write down what 'normal' is for that machine.",
"New oil is not clean oil — filter it on the way into any critical machine.",
"A desiccant breather with spent, fully color-changed gel is just an open pipe — replace it.",
"If a bearing runs hot right after greasing and cools over a few days, you over-greased it.",
"Sample oil from the same point, the same way, every time — trending dies when the method wanders.",
"Never top up a system with a different oil just because the viscosity grade matches.",
"Grease color tells you nothing about thickener type — read the data sheet, not the dye.",
"Keep grease guns dedicated: one gun, one grease, with the product name on the gun.",
"Too much grease is a failure mode, not insurance — one-third to one-half full is the target for most bearings.",
"Drain free water from sumps on a schedule, but spend your real effort finding where it gets in.",
"When you change grease types, purge until new grease exits clean, then shorten the next intervals.",
"Foam standing on a reservoir surface is a symptom — check suction leaks, level, and return splash.",
"Put the sample label on the bottle before you pull the sample, not after you walk away.",
"An oil ring that isn't spinning is a bearing that isn't being lubricated — look through the sight glass.",
"Rotate lubricant stock first in, first out, and date every container the day it arrives.",
"Read the failed bearing before it hits the scrap bin — its surfaces name the failure mode.",
"Keep a short approved-product list and make machine tags match container labels exactly.",
"Slow down the pump when greasing by hand — slow strokes feed the bearing instead of blowing the seal.",
"A rising ISO cleanliness code over two samples is a warning even if you're still inside the target.",
"Write the decision on every oil analysis report — act, watch, or resample — and sign it."
];

/* ===================== STATE ===================== */
var KEY = "taf-mlt1-training-v1";
var state = { done:{}, best:{} };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var p = JSON.parse(raw); if (p && p.done && p.best) state = p; }
} catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

var ALL = [];
COURSES.forEach(function(c){ c.lessons.forEach(function(l){ ALL.push({course:c, lesson:l}); }); });
function totalDone(){ return ALL.filter(function(x){ return state.done[x.lesson.id]; }).length; }
function courseDone(c){ return c.lessons.filter(function(l){ return state.done[l.id]; }).length; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ===================== NAV ===================== */
var views = ["home","courses","lesson","quizbank","tips"];
var currentTab = "home";
function show(name){
  views.forEach(function(v){ document.getElementById("view-"+v).classList.toggle("hidden", v!==name); });
  var tabFor = (name==="lesson") ? "courses" : name;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.tab===tabFor); });
  currentTab = name;
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    var tab = t.dataset.tab;
    if (tab==="home") renderHome();
    if (tab==="courses") renderCourses();
    if (tab==="quizbank") renderQuizBank();
    if (tab==="tips") renderTips();
    show(tab);
  });
});

/* ===================== HOME ===================== */
var resetArmed = false, resetTimer = null;
function badges(){
  var d = totalDone();
  var c1 = COURSES[0].lessons.every(function(l){ return state.done[l.id]; });
  var c3 = COURSES[2].lessons.every(function(l){ return state.done[l.id]; });
  return [
    {icon:"⚙", name:"First Lesson Done", desc:"Pass any 1 lesson", got: d>=1},
    {icon:"🔧", name:"Halfway There", desc:"Pass 15 of 30 lessons", got: d>=15},
    {icon:"🛢", name:"Fundamentals Complete", desc:"Finish Course 1", got: c1},
    {icon:"🔬", name:"Contamination & Analysis Complete", desc:"Finish Course 3", got: c3},
    {icon:"🏆", name:"All Lessons Complete", desc:"Pass all 30 lessons", got: d>=ALL.length}
  ];
}
function nextLesson(){
  for (var i=0;i<ALL.length;i++){ if (!state.done[ALL[i].lesson.id]) return ALL[i]; }
  return null;
}
function renderHome(){
  var d = totalDone(), total = ALL.length;
  var pct = Math.round(d/total*100);
  var C = 2*Math.PI*48, off = C - (C*d/total);
  var nx = nextLesson();
  var html = "";
  html += '<div class="hero"><div class="ring-wrap">'
    + '<svg width="118" height="118" viewBox="0 0 118 118">'
    + '<circle cx="59" cy="59" r="48" fill="none" stroke="#1d3552" stroke-width="11"/>'
    + '<circle cx="59" cy="59" r="48" fill="none" stroke="#4da3ff" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
    + '</svg><div class="ring-center"><div class="pct">'+pct+'%</div><div class="lbl">'+d+' of '+total+' lessons</div></div></div>'
    + '<div class="hero-txt"><h2>'+(d===0 ? "Start with the fundamentals" : (nx ? "Keep going — you're on track" : "All lessons passed. Nice work."))+'</h2>'
    + '<p>30 short lessons and 150 quiz questions covering lubrication fundamentals, selection, contamination control, oil analysis, and program management.</p>'
    + (nx ? '<button class="btn" id="startBtn">'+(d===0?"Start: ":"Continue: ")+esc(nx.lesson.title)+'</button>'
          : '<button class="btn" id="startBtn">Review courses</button>')
    + '</div></div>';
  html += '<p class="disclaimer">Training and preparation only — this app does not grant any certification. Progress is stored only on this device.</p>';
  html += '<h2 class="sec">Your courses</h2>';
  COURSES.forEach(function(c){
    var cd = courseDone(c), ct = c.lessons.length, pc = Math.round(cd/ct*100);
    html += '<div class="course-card"><div class="row"><h3>'+esc(c.title)+'</h3><span class="cnt">'+cd+' / '+ct+' passed</span></div>'
      + '<div class="bar"><i style="width:'+pc+'%"></i></div></div>';
  });
  html += '<h2 class="sec">Badges</h2><div class="badges">';
  badges().forEach(function(b){
    html += '<div class="badge '+(b.got?"earned":"locked")+'"><div class="ic">'+b.icon+'</div><div><b>'+esc(b.name)+'</b><span>'+(b.got?"Earned ✓":esc(b.desc))+'</span></div></div>';
  });
  html += '</div>';
  html += '<div class="reset-zone"><button class="reset-link" id="resetLink">Reset all progress</button></div>';
  document.getElementById("view-home").innerHTML = html;
  document.getElementById("startBtn").addEventListener("click", function(){
    if (nx) openLesson(nx.course, nx.lesson); else { renderCourses(); show("courses"); }
  });
  var rl = document.getElementById("resetLink");
  rl.addEventListener("click", function(){
    if (!resetArmed) {
      resetArmed = true; rl.textContent = "Tap again to confirm reset — this clears all progress"; rl.classList.add("armed");
      clearTimeout(resetTimer); resetTimer = setTimeout(function(){ resetArmed=false; renderHome(); if(currentTab==="home") show("home"); }, 4000);
    } else {
      clearTimeout(resetTimer); resetArmed = false;
      state = { done:{}, best:{} }; save(); renderHome(); show("home");
    }
  });
}

/* ===================== COURSES ===================== */
function renderCourses(){
  var html = "";
  COURSES.forEach(function(c, ci){
    html += '<h2 class="sec">Course '+(ci+1)+' · '+esc(c.title)+'</h2>';
    c.lessons.forEach(function(l, li){
      var done = !!state.done[l.id];
      var best = state.best[l.id];
      html += '<button class="lesson-row'+(done?" done":"")+'" data-c="'+c.id+'" data-l="'+l.id+'">'
        + '<span class="num">'+(done?"✓":(li+1))+'</span>'
        + '<span class="t"><b>'+esc(l.title)+'</b><span>'+l.mins+' min read · 5 questions'+(best!=null ? ' · Best score '+best+'/5' : '')+(done?' · Passed':'')+'</span></span>'
        + '<span class="chev">›</span></button>';
    });
  });
  document.getElementById("view-courses").innerHTML = html;
  document.querySelectorAll("#view-courses .lesson-row").forEach(function(b){
    b.addEventListener("click", function(){
      var c = COURSES.filter(function(x){ return x.id===b.dataset.c; })[0];
      var l = c.lessons.filter(function(x){ return x.id===b.dataset.l; })[0];
      openLesson(c, l);
    });
  });
}

/* ===================== LESSON ===================== */
var quizState = null;
function openLesson(course, lesson){
  quizState = { answers:{}, score:0, total:lesson.quiz.length, lessonId:lesson.id };
  var ci = COURSES.indexOf(course)+1;
  var li = course.lessons.indexOf(lesson)+1;
  var html = '<button class="backlink" id="backBtn">‹ Back to courses</button>';
  html += '<div class="lesson-head"><h2>'+esc(lesson.title)+'</h2>'
    + '<p class="meta">Course '+ci+' · '+esc(course.title)+' · Lesson '+li+' of '+course.lessons.length+' · '+lesson.mins+' min read</p></div>';
  lesson.sections.forEach(function(s){
    html += '<div class="teach"><h3>'+esc(s.h)+'</h3><p>'+esc(s.p)+'</p></div>';
  });
  html += '<div class="watch"><h3>⚠ What to watch for</h3><ul>';
  lesson.watch.forEach(function(w){ html += '<li>'+esc(w)+'</li>'; });
  html += '</ul></div>';
  html += '<h3 class="quiz-title">Check your understanding</h3><p class="quiz-sub">5 questions · score 4 or 5 to pass · unlimited retakes</p>';
  html += '<div id="quizZone">';
  lesson.quiz.forEach(function(q, qi){
    html += '<div class="q" data-q="'+qi+'"><p class="qq">'+(qi+1)+'. '+esc(q.q)+'</p>';
    q.o.forEach(function(o, oi){
      html += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>';
    });
    html += '<p class="why" id="why-'+qi+'"></p></div>';
  });
  html += '</div><div id="lessonResult"></div>';
  document.getElementById("view-lesson").innerHTML = html;
  document.getElementById("backBtn").addEventListener("click", function(){ renderCourses(); show("courses"); });
  document.querySelectorAll("#view-lesson .opt").forEach(function(b){
    b.addEventListener("click", function(){ answerLesson(lesson, b); });
  });
  show("lesson");
}
function answerLesson(lesson, btn){
  var qi = +btn.dataset.q, oi = +btn.dataset.o;
  if (quizState.answers[qi] != null) return;
  var q = lesson.quiz[qi];
  quizState.answers[qi] = oi;
  var correct = (oi === q.a);
  if (correct) quizState.score++;
  var box = btn.closest(".q");
  box.querySelectorAll(".opt").forEach(function(o){
    o.disabled = true;
    var oidx = +o.dataset.o;
    if (oidx === q.a) o.classList.add("correct");
    else if (oidx === oi) o.classList.add("wrong");
    else o.classList.add("dim");
  });
  var why = document.getElementById("why-"+qi);
  why.innerHTML = (correct ? "<b>Correct.</b> " : "<b>Not quite.</b> ") + esc(q.why);
  why.classList.add("show");
  if (Object.keys(quizState.answers).length === quizState.total) finishLesson(lesson);
}
function finishLesson(lesson){
  var s = quizState.score, pass = s >= 4;
  var prevBest = state.best[lesson.id] || 0;
  if (s > prevBest) state.best[lesson.id] = s;
  if (pass) state.done[lesson.id] = true;
  save();
  var html = '<div class="result '+(pass?"pass":"fail")+'"><h3>'+(pass?"Passed":"Not yet")+' — '+s+' / 5</h3>'
    + '<p>'+(pass ? "Lesson marked complete. Your best score is saved on this device."
                   : "You need 4 of 5 to pass. Re-read the sections above and try again — retakes are unlimited.")+'</p>'
    + '<div class="rowbtns"><button class="btn ghost" id="retakeBtn">Retake quiz</button>'
    + '<button class="btn" id="toCoursesBtn">Back to courses</button></div></div>';
  var zone = document.getElementById("lessonResult");
  zone.innerHTML = html;
  zone.scrollIntoView({behavior:"smooth", block:"center"});
  document.getElementById("retakeBtn").addEventListener("click", function(){
    var c = COURSES.filter(function(x){ return x.lessons.indexOf(lesson) >= 0; })[0];
    openLesson(c, lesson);
  });
  document.getElementById("toCoursesBtn").addEventListener("click", function(){ renderCourses(); show("courses"); });
}

/* ===================== QUIZ BANK ===================== */
var bank = null;
function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function renderQuizBank(){
  var pool = [];
  ALL.forEach(function(x){ x.lesson.quiz.forEach(function(q){ pool.push({q:q, lessonTitle:x.lesson.title, courseTitle:x.course.title}); }); });
  shuffle(pool);
  bank = { items: pool.slice(0,20), answers:{}, score:0 };
  var html = '<div class="lesson-head"><h2>Quiz Bank</h2><p class="meta">20 questions drawn at random from all 150 lesson questions. Quiz Bank scores do not mark lessons as passed.</p></div>';
  html += '<button class="btn block" id="newBankBtn" style="margin-bottom:14px">↻ New 20 questions</button>';
  html += '<div id="bankZone">';
  bank.items.forEach(function(it, qi){
    html += '<div class="q" data-q="'+qi+'"><p class="qq">'+(qi+1)+'. '+esc(it.q.q)+'</p>';
    it.q.o.forEach(function(o, oi){ html += '<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>'; });
    html += '<p class="why" id="bwhy-'+qi+'"></p></div>';
  });
  html += '</div><div id="bankResult"></div>';
  document.getElementById("view-quizbank").innerHTML = html;
  document.getElementById("newBankBtn").addEventListener("click", function(){ renderQuizBank(); show("quizbank"); });
  document.querySelectorAll("#view-quizbank .opt").forEach(function(b){
    b.addEventListener("click", function(){ answerBank(b); });
  });
}
function answerBank(btn){
  var qi = +btn.dataset.q, oi = +btn.dataset.o;
  if (bank.answers[qi] != null) return;
  var it = bank.items[qi], q = it.q;
  bank.answers[qi] = oi;
  var correct = (oi === q.a);
  if (correct) bank.score++;
  var box = btn.closest(".q");
  box.querySelectorAll(".opt").forEach(function(o){
    o.disabled = true;
    var oidx = +o.dataset.o;
    if (oidx === q.a) o.classList.add("correct");
    else if (oidx === oi) o.classList.add("wrong");
    else o.classList.add("dim");
  });
  var why = document.getElementById("bwhy-"+qi);
  why.innerHTML = (correct ? "<b>Correct.</b> " : "<b>Not quite.</b> ") + esc(q.why);
  why.classList.add("show");
  if (Object.keys(bank.answers).length === bank.items.length) finishBank();
}
function finishBank(){
  var s = bank.score, total = bank.items.length;
  var msg;
  if (s >= 18) msg = "Exam-ready form. Keep the streak warm with a fresh set now and then.";
  else if (s >= 14) msg = "Solid. Review the misses below and you'll close the gap fast.";
  else if (s >= 10) msg = "Getting there. Work through the missed lessons, then draw a new set.";
  else msg = "Good starting point — the lessons are short. Revisit the topics below and try a fresh 20.";
  var html = '<div class="result '+(s>=14?"pass":"fail")+'"><h3>Score: '+s+' / '+total+'</h3><p>'+msg+'</p>'
    + '<div class="rowbtns"><button class="btn" id="againBtn">New 20 questions</button></div></div>';
  var missed = bank.items.filter(function(it, i){ return bank.answers[i] !== it.q.a; });
  if (missed.length){
    html += '<h2 class="sec">Missed questions — review</h2>';
    missed.forEach(function(it){
      html += '<div class="missed"><div class="src">From: '+esc(it.lessonTitle)+'</div>'
        + '<p><b>'+esc(it.q.q)+'</b></p>'
        + '<p class="ca">Correct answer: '+esc(it.q.o[it.q.a])+'</p>'
        + '<p>'+esc(it.q.why)+'</p></div>';
    });
  } else {
    html += '<div class="missed"><p><b>Perfect run — no misses to review.</b></p></div>';
  }
  var zone = document.getElementById("bankResult");
  zone.innerHTML = html;
  zone.scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("againBtn").addEventListener("click", function(){ renderQuizBank(); show("quizbank"); });
}

/* ===================== TIPS ===================== */
function renderTips(){
  var html = '<div class="lesson-head"><h2>Lube Tips</h2><p class="meta">24 weekly field tips — one practical habit at a time.</p></div>';
  TIPS.forEach(function(t, i){
    html += '<div class="tip"><span class="wk">Week '+(i+1)+'</span><p>'+esc(t)+'</p></div>';
  });
  document.getElementById("view-tips").innerHTML = html;
}

/* ===================== INIT ===================== */
renderHome();
renderCourses();
renderTips();
show("home");
</script>
